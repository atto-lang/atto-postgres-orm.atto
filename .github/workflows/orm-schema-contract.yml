name: ORM portable catalog host checks (not native)
on:
  pull_request:
    paths:
      - 'src/schema.ores'
      - 'tests/schema-plans.ores'
      - 'tests/schema-adversarial.ores'
      - 'scripts/verify-native-plans'
      - 'tests/test_schema_contract.py'
      - 'tests/test_orm_semantics_host.py'
      - 'tests/test_orm_pairwise_matrix_host.py'
      - 'scripts/orm_semantics_host.py'
      - 'scripts/orm_admission_host.py'
      - 'tests/test_orm_admission_host.py'
      - 'tests/test_pg_catalog_projection_host.py'
      - 'scripts/orm_pg_catalog_projection_host.py'
      - 'contracts/**'
      - '.github/workflows/orm-schema-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-json-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation dependency
        run: python -m pip install 'jsonschema==4.25.1'
      - name: Execute pinned host suites (reject missing/zero discovered tests)
        run: |
          python - <<'PY'
          import sys
          import unittest
          required = {
              'test_schema_contract.py': 30,
              'test_orm_semantics_host.py': 8,
              'test_orm_pairwise_matrix_host.py': 10,
              'test_orm_admission_host.py': 23,
              'test_pg_catalog_projection_host.py': 27,
          }
          runner = unittest.TextTestRunner(verbosity=2)
          count = 0
          for pattern, minimum in required.items():
              suite = unittest.TestLoader().discover('tests', pattern=pattern)
              discovered = suite.countTestCases()
              if discovered < minimum:
                  raise SystemExit(f'MISSING_TESTS: {pattern} had {discovered}, required at least {minimum}')
              result = runner.run(suite)
              if not result.wasSuccessful():
                  raise SystemExit(f'HOST_TEST_FAILURE: {pattern}')
              count += discovered
          print(f'ORM_SCHEMA_HOST_ONLY: PASS {count} discovered tests; no guest/TypeSpec/DB evidence')
          PY
      - name: Exercise checked-in review-only JSON via integrated CLI
        run: |
          python scripts/orm_admission_host.py --kind catalog --input contracts/examples/current.catalog.json
          python scripts/orm_admission_host.py --kind catalog --input contracts/examples/desired.catalog.json
          python scripts/orm_admission_host.py --kind review --input contracts/examples/plan-preview.json
      - name: Evidence boundary
        run: echo 'JSON_SCHEMA_HOST_ONLY: no TypeSpec semantic parity, Oreslang compiler, SQL or PostgreSQL tests executed'
