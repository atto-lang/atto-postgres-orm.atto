name: ORM portable catalog host checks (not native)
on:
  pull_request:
    paths:
      - 'src/schema.ores'
      - 'tests/schema-plans.ores'
      - 'tests/schema-adversarial.ores'
      - 'tests/schema-invariants.ores'
      - 'scripts/verify-native-plans'
      - 'tests/test_schema_contract.py'
      - 'tests/test_catalog_differential_host.py'
      - 'tests/migration_portability.rs'
      - 'docs/MIGRATION_BACKEND_PARITY.md'
      - 'contracts/**'
      - '.github/workflows/orm-schema-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-json-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation dependency
        run: python -m pip install 'jsonschema==4.25.1'
      - name: Validate peer JSON Schema fixtures and hostile inputs
        run: python -m unittest discover -s tests -p 'test_schema_contract.py' -v
      - name: Run deterministic independent structural oracles
        run: python -m unittest discover -s tests -p 'test_catalog_differential_host.py' -v
      - name: Evidence boundary
        run: echo 'JSON_SCHEMA_HOST_ONLY: no TypeSpec semantic parity, Oreslang compiler, SQL or PostgreSQL tests executed'

  migration-source-guard-rust-only:
    name: Rust-only migration source guard (NOT guest parity)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout same private repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Rust source guard (no database, no native guest)
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 --test tests/migration_portability.rs -o "${RUNNER_TEMP}/orm-migration-source-tests"
          "${RUNNER_TEMP}/orm-migration-source-tests" --nocapture
          printf '%s\n' 'MIGRATION_STATIC_ONLY: no Oreslang guest, TypeSpec differential, PostgreSQL driver or backend parity proven'
