name: ORM portable catalog host checks (not native)
on:
  pull_request:
    paths:
      - 'src/schema.ores'
      - 'tests/schema-plans.ores'
      - 'tests/schema-adversarial.ores'
      - 'tests/schema-invariants.ores'
      - 'tests/orm-cross-backend.ores'
      - 'scripts/verify-native-plans'
      - 'scripts/verify-orm-five-backend-receipts.py'
      - 'tests/test_schema_contract.py'
      - 'tests/test_catalog_differential_host.py'
      - 'tests/test_orm_five_backend_gate.py'
      - 'tests/test_pg17_metadata_contract.py'
      - 'tests/pg17-catalog-readback-e2e.sql'
      - 'tests/pg17-catalog-metadata-e2e.sql'
      - 'tests/pg17-catalog-metadata-e2e.bash'
      - 'tests/pg17-catalog-readback-e2e.bash'
      - 'tests/pg17-migration-lock-e2e.bash'
      - 'tests/pg17-migration-lock-abort-e2e.bash'
      - 'tests/pg17-migration-history-e2e.sql'
      - 'tests/pg17-migration-history-e2e.bash'
      - 'contracts/**'
      - '.github/workflows/orm-schema-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-json-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use pinned Python setup action
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned validation dependency
        run: python -m pip install 'jsonschema==4.25.1'
      - name: Compile host test Python and parse all PG17 E2E shells
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tests scripts/verify-orm-five-backend-receipts.py
          for script in tests/pg17-*.bash; do
            bash -n "$script"
          done
      - name: Validate peer JSON Schema fixtures and hostile inputs
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit five-backend ORM receipt coverage (source only)
        run: |
          set -euo pipefail
          python scripts/verify-orm-five-backend-receipts.py | tee orm-parity-preflight.txt
          grep -Fx 'NOT_VERIFIED: 5 toolchains x 5 suites = 25 compiled guest receipts required' orm-parity-preflight.txt
      - name: Evidence boundary
        run: echo 'JSON_SCHEMA_HOST_ONLY: no TypeSpec semantic parity, Oreslang compiler, SQL or PostgreSQL tests executed'
